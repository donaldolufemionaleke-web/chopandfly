<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" 
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChopandFly — Online Kitchen · Delivered to You</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />

  <!-- Custom Tailwind Config -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-primary':  '#E85D26',
            'brand-mid':      '#F07A45',
            'brand-light':    '#FEF0E9',
            'brand-pale':     '#FFF8F4',
            'brand-dark':     '#8B2500',
            'brand-soft':     '#FDDCCC',
            'brand-muted':    '#D04A18',
            'purple-primary': '#7C3AED',
            'purple-mid':     '#A855F7',
            'purple-light':   '#EDE9FE',
            'purple-pale':    '#F5F3FF',
            'purple-dark':    '#4C1D95',
            'purple-soft':    '#DDD6FE',
          },
          fontFamily: {
            display: ['"Playfair Display"', 'Georgia', 'serif'],
            body: ['"Inter"', 'sans-serif'],
          },
        }
      }
    }
  </script>

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="font-body bg-white text-gray-900">

  <!-- React Mount Point -->
  <div id="root"></div>

  <!-- Firebase SDK v9 (modular) -->
  <!-- CHANGE: https://firebase.google.com/docs/web/modular-upgrade -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js';
    import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js';
    
    // Firebase config - USER: Replace with your config from Firebase Console
    window.firebaseConfig = {
      apiKey: "AIzaSyASmk8QJwxNd37zllLm637qnOkXSECuFmY",
      authDomain: "chopandfly-orders.firebaseapp.com",
      projectId: "chopandfly-orders",
      storageBucket: "chopandfly-orders.firebasestorage.app",
      messagingSenderId: "300932207087",
      appId: "1:300932207087:web:0d1048253957a29093261a"
    };
    
    // Initialize Firebase
    const app = initializeApp(window.firebaseConfig);
    window.db = getFirestore(app);
    
    // Export Firestore functions globally for app.js
    window.addOrder = async (order) => {
      try {
        return await addDoc(collection(window.db, "orders"), order);
      } catch (e) {
        console.error("Firebase error:", e);
        return null;
      }
    };
    
    window.getOrders = async () => {
      try {
        const snapshot = await getDocs(collection(window.db, "orders"));
        return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      } catch (e) {
        console.error("Firebase error:", e);
        return [];
      }
    };
    
    window.updateOrderStatus = async (docId, status) => {
      try {
        await updateDoc(doc(window.db, "orders", docId), { status });
      } catch (e) {
        console.error("Firebase error:", e);
      }
    };
    
    window.deleteOrder = async (docId) => {
      try {
        await deleteDoc(doc(window.db, "orders", docId));
      } catch (e) {
        console.error("Firebase error:", e);
      }
    };
    
    window.listenOrders = (callback) => {
      const q = query(collection(window.db, "orders"), orderBy("timestamp", "desc"));
      return onSnapshot(q, (snapshot) => {
        const orders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        callback(orders);
      });
    };
  </script>
  
  <!-- React & ReactDOM via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- App Entry -->
  <script type="text/babel" src="js/app.js"></script>
</body>
</html>
